# **project 名は `./task` が `-p` で渡す** (#82)。**ここに固定で書かない**——
# **作業場ごとに分ける**ので、書くと 2 人目が 1 人目のコンテナを掴む。
# **compose を直接叩くときは `-p` を付けること**（`./task` を通せば自動で付く）。

x-dev-image: &dev-image
  build:
    context: .
    target: dev
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      DOCKER_GID: ${DOCKER_GID:-999}

services:
  # 開発コンテナ兼 dev サーバー。`compose up` した時点でアプリが動いている。
  # lint やテストはここへ exec で流し込む (dev サーバーと併存できる)。
  # Supabase のローカルスタックは supabase CLI が別途コンテナ群を立てるので、
  # ここには DB を定義しない (`./task db:up` を参照)。
  app:
    <<: *dev-image
    init: true
    # ホストと同一パスにマウントする。Supabase CLI (supabase-cli サービス) が
    # ホストの Docker daemon を操作するため、パスが一致していないと
    # マイグレーションや seed の bind mount が解決できなくなる。
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
      # pnpm のグローバルストア。再ビルドのたびに再ダウンロードしないため
      - pnpm-store:/home/node/.local/share/pnpm/store
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    # 公開インターフェースには晒さない。手元 PC からは SSH ポートフォワードで繋ぐ
    # **ポートは作業場ごとに変える** (#82)。既定は 3000（`./task` が決める）。
    # **公開インターフェースには晒さない。** 手元 PC からは SSH ポートフォワードで繋ぐ
    ports:
      - "127.0.0.1:${VALENCE_APP_PORT:-3000}:3000"
    # Supabase のローカルスタックと同じ docker network に相乗りする。
    # サーバー側から Supabase を叩くときは、ホストの公開ポートを経由せず
    # コンテナ名で解決できる (http://kong:8000)。
    networks:
      - default
      - supabase
    # CMD は Dockerfile 側で `pnpm dev`。ここで上書きしない。

  # Supabase CLI 専用の使い捨てコンテナ (`./task db:*` から compose run で叩く)。
  #
  # CLI はホストの Docker daemon にスタックを立てさせる一方、その疎通確認は
  # 自分自身の 127.0.0.1 を見に行く。そのため docker socket とホストの
  # ネットワーク名前空間の両方が要る。
  #
  # これを app に持たせると、アプリのコンテナがホスト root 相当の権限と
  # ホストのネットワークを常時抱えることになる。必要なのは CLI だけなので
  # 切り出し、app 側は素の bridge ネットワークのままにしてある。
  supabase-cli:
    <<: *dev-image
    init: true
    profiles: ["tools"]
    working_dir: ${PWD}
    volumes:
      - ${PWD}:${PWD}
      - pnpm-store:/home/node/.local/share/pnpm/store
      - /var/run/docker.sock:/var/run/docker.sock
    # config.toml の env() 置換はこのコンテナのプロセス環境から解決される。
    # 渡し忘れると GitHub OAuth の資格情報が空のままスタックが起動する。
    env_file:
      - path: .env
        required: false
    network_mode: host

  # GitHub Webhook をローカルの Next.js へ転送する。
  # SMEE_URL を .env に設定したうえで `./task smee` で起動する。
  smee:
    image: node:24-bookworm-slim
    init: true
    profiles: ["webhook"]
    env_file:
      - path: .env
        required: false
    command: >
      npx --yes smee-client
      --url ${SMEE_URL:-}
      --target http://app:3000/api/github/webhook
    depends_on:
      - app

networks:
  default:
  # supabase CLI が作る network。同名のものが既にあれば CLI はそれを再利用するため、
  # ./task が先に用意しておく。ライフサイクルは Supabase 側にあるので external 扱い。
  supabase:
    name: supabase_network_valence
    external: true

volumes:
  pnpm-store:
