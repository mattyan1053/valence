name: CI

on:
  push:
    branches: [main]
  pull_request:

# public リポジトリなので既定を最小権限にする。必要なジョブで個別に足す。
permissions:
  contents: read

# 同じブランチで新しい push があったら古い実行は捨てる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: lint / typecheck / boundaries / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ローカルの `./task check` と同じ内容を、同じ順序で流す。
      # 落ちた段階が分かるようにステップを分けている。
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check layer boundaries
        run: pnpm depcruise

      - name: Test
        run: pnpm test:coverage

  # **行が持ち主にしか見えないことを、本物の Postgres で確かめる** (#210)。
  #
  # **`./task check` からは外してある。** worker が 1 周ごとに叩くものへ
  # スタックの起動を足すと、**起きていないだけで赤になる**——**「落ちた」と
  # 「まだ起きていない」が混ざる。** **走らせる場所はここである。**
  database:
    name: database policies
    runs-on: ubuntu-latest
    # **Supabase の起動 (image の取得を含む) が入るぶん、他より長く取る。**
    # **宣言しないと 360 分**になり、詰まった実行を誰も止めない。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # **Supabase が使う 543xx は、Linux の一時ポート範囲 (32768-60999) の内側にある。**
      # **`supabase start` は自分で image を取りに行く**ので、**その数十本の外向き接続の
      # 1 本が 54322 を送信元ポートに掴んだまま bind へ進むと落ちる**
      # ——実際に落ちた (`failed to bind host port for 0.0.0.0:54322`)。
      #
      # **`config.toml` のポートは変えない。** **あれは開発機と共有している値**で、
      # ここだけずらすと**「手元では通るが CI では別の場所を見ている」**が生まれる。
      # **runner 側で、その番号を一時ポートに割り当てさせない。**
      #
      # **番号は `config.toml` から引く。** 2 箇所に書くと、**片方だけ動いたときに
      # 予約から外れたポートができる**——**症状は同じ bind 失敗**で、原因は見えない。
      - name: Reserve Supabase ports
        run: |
          ports="$(grep -oE '^(shadow_)?port = 543[0-9]{2}$' supabase/config.toml \
            | grep -oE '[0-9]+$' | sort -n -u)"
          if [ -z "$ports" ]; then
            echo "supabase/config.toml からポートを読み取れませんでした (書式が変わった?)" >&2
            exit 1
          fi
          low="$(echo "$ports" | head -1)"
          high="$(echo "$ports" | tail -1)"
          echo "一時ポート範囲: $(cat /proc/sys/net/ipv4/ip_local_port_range)"
          sudo sysctl -w "net.ipv4.ip_local_reserved_ports=${low}-${high}"
          # **効いたことを読み直す。** **効かないまま進むと、同じ bind 失敗が
          # 「原因不明」として返ってくる**——**入れた対策が働いているかを、
          # 対策自身が確かめる。**
          reserved="$(tr -d '[:space:]' </proc/sys/net/ipv4/ip_local_reserved_ports)"
          if [ "$reserved" != "${low}-${high}" ]; then
            echo "ポートを予約できていません (要求: ${low}-${high} / 実際: ${reserved})" >&2
            exit 1
          fi
          # **予約は「これから割り当てない」であって、いま掴んでいる者を放させない。**
          # **既に誰かが持っているなら、ここで名指しする**——**次に落ちたときに
          # 「何が持っていたか」が残る**（`ss` の結果が無いまま落ちるのが、いちばん困る）。
          filter="$(echo "$ports" | awk '{printf "%ssport = :%s", (NR > 1 ? " or " : ""), $1}')"
          # **除くのは TIME-WAIT だけ** (#253 / #256 のレビュー)。**あれは
          # 送信元ポートにその番号を使った接続の残骸**で、**Supabase が bind するのを
          # 妨げない**——**除かないと、DB へ触っていない PR が確率的に落ちる** (#252)。
          #
          # **listen だけに絞らない。** **上に書いたとおり、bind を妨げるのは
          # 外向きの接続 (ESTABLISHED / SYN-SENT) のほう**である
          # ——**そちらを落とすと、この step が入った理由そのものが見えなくなる。**
          #
          # **`ss` が落ちたら、そこで落ちる。** **条件の中で呼ぶと、失敗が
          # 「握っていない」と同じ見え方**になり、**見張りが黙って外れる。**
          held="$(ss -tanH state all exclude time-wait "$filter")"
          if [ -n "$held" ]; then
            echo "Supabase が使うポートを、既に何かが握っています:" >&2
            ss -tanpH state all exclude time-wait "$filter" >&2
            # **妨げにならないものも出す。** **次に落ちたとき、何が居たのかを
            # 読めるのはここだけ**である (`ss` の結果が無いまま落ちるのが、いちばん困る)。
            echo "同じポートの全ての socket (参考。TIME-WAIT は妨げにならない):" >&2
            ss -tanp "$filter" >&2
            exit 1
          fi

      # マイグレーションはここで適用される (起動時に supabase/migrations/ を流す)。
      - name: Start Supabase
        run: pnpm exec supabase start

      # **接続情報はスタックから取る。** リポジトリにも secrets にも置かない
      # (ローカルスタックの既定値で、どの機械でも同じもの)。
      - name: Run database policy tests
        run: |
          eval "$(pnpm exec supabase status -o env | grep -E '^[A-Z_]+=')"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$PUBLISHABLE_KEY" \
          SUPABASE_SECRET_KEY="$SECRET_KEY" \
          SUPABASE_JWT_SECRET="$JWT_SECRET" \
            pnpm test:db

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # **記録した実例の値が本当であることを、実際に測り直して確かめる** (#242 / #309)。
  #
  # **`./task check` からは外してある。** `bin/loop-fixup-lines` は GitHub の
  # レビュースレッドと `compare` を叩くので**網と認証が要る**——**worker が 1 周ごとに
  # 叩くものへ入れると、外の状態で赤になる**（`database` job と同じ理由）。
  #
  # **形を見る試験は `./task check` の側にある。** **あちらは列が揃っているかしか
  # 見ていない**ので、**`70` を `700` に書き換えても緑**である——**赤くするのはここ。**
  fixup-limit-basis:
    name: fixup limit basis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # **`bin/loop-fixup-lines` が読むのは、この repo の PR のレビューと diff だけ**
      # なので、既定の読み取り権限で足りる（`permissions: contents: read`）。
      - name: Verify recorded examples
        run: bin/loop-fixup-basis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
