name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 新しいクエリが追加されることがあるので、変更が無くても定期的に回す。
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # queries は指定しない。既定の security クエリだけで運用する。
          # security-extended / security-and-quality は精度の低いクエリや
          # 保守性のアラートまで拾い、ノイズで本命の指摘が埋もれる。

      - uses: github/codeql-action/analyze@v4
