name: 作業・改善
description: 実装したいこと、直したい設計、気になっている点をまとめる
# backlog に入れる。master は backlog / ready / in-progress しか見ないので、
# ここが抜けると起票が候補から漏れる（存在しない label は GitHub が黙って落とす）。
labels: ["backlog"]
body:
  - type: markdown
    attributes:
      value: |
        仕様書は作らない方針です（`AGENTS.md` §6）。
        ここには**コードを読んでも分からないこと**——なぜやるのか、何をもって完了とするか——を書いてください。

  - type: textarea
    id: why
    attributes:
      label: なぜやるか
      description: 解決したい問題、放置した場合に何が困るか
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: やること
      description: 箇条書きで。分割して別 PR にする想定なら、その単位も書いておく
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 完了条件
      description: 何が確認できたら閉じてよいか

  - type: textarea
    id: evidence
    attributes:
      label: 確かめたこと
      description: |
        本文に書いた「現状はこうなっている」の根拠。**読んだのか、走らせたのか**を分けて書く。
        走らせたなら、その出力（`AGENTS.md` §6 に当たるものは貼らない）。
        読んだだけなら「〜と読んだ。確かめていない」と書く——**確かめていない前提の上に、
        完了条件を建てない**（`loop/procedure/master.md` のステップ 5）。
        **確かめていないなら空欄でよい。空欄は「確かめていない」と読む**
        （必須にすると `n/a` が埋まり、欲しかった区別がそこで消える）。

  - type: textarea
    id: out-of-scope
    attributes:
      label: やらないこと
      description: 意図的にスコープから外すもの（無ければ空欄で構いません）
