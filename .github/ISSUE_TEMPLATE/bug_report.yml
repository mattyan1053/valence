name: バグ報告
description: 期待どおりに動かない箇所を報告する
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        再現手順が書けない段階でも構いません。分かっている範囲で埋めてください。

  - type: textarea
    id: what-happened
    attributes:
      label: 何が起きたか
      description: エラーメッセージやログがあれば貼ってください（トークンや秘密鍵は伏せること）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待した挙動
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. ./task up
        2. http://localhost:3000 を開く
        3. ...

  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 分かる範囲で。`./task` 経由なら大半はコンテナ内で揃っているはずです
      placeholder: |
        ホスト OS:
        docker version:
        ブラウザ:
