version: 2
updates:
  # npm 依存。パッチ・マイナーはまとめて 1 PR にして、レビュー回数を減らす。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ランタイムと型定義はセットで上げる。Node のメジャーは LTS だけを追うので
      # 自動 PR に任せず、Dockerfile と一緒に手で上げる。
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript のメジャーは Next のサポート状況を見てから上げる。
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "⬆️ deps:"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "⬆️ deps:"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Node のメジャーは奇数系が LTS にならない。Dependabot は最新を取りに行くので
      # (例: 25)、メジャーの追従は LTS を確認したうえで手で行う。
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "⬆️ deps:"
